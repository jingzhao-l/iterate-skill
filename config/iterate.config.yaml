# Iterate Skill 默认配置 / Default configuration
# 复制到项目根目录并修改，即可覆盖默认值。
# Copy this file to project root to override defaults.
#
# 重要 / IMPORTANT:
# 下方的 validation 命令只是示例，必须根据你的实际项目自定义。
# The validation commands below are examples only. You MUST customize them
# for your actual project stack, package manager, and module layout.

# 迭代目标 / Iteration goal
goal: "Improve code quality and maintainability"

# 最大轮数 / Max rounds
max_rounds: 7

# 输出语言 / Output language: zh | en
language: en

# 启用的审查维度 / Enabled review dimensions
# 可用值见 config/dimensions.yaml
dimensions:
  - correctness
  - security
  - performance
  - architecture
  - style-tests
  - tech-debt
  - spec-compliance
  - frontend-backend
  - ui-ux

# 审查范围 / Review scope
# - changed-only: 仅审查本轮有改动的文件（增量审查）。
# - full:         每次审查整个代码库（全量审查）。
review:
  scope: full

# 原子问题判定阈值 / Atomic issue thresholds
atomic:
  max_lines: 20
  max_adjacent_methods: 3

# Git 配置 / Git configuration
git:
  target_branch: main
  use_worktree: false
  # 每轮修复验证通过后是否立即 push。
  # true:  每轮都 push（旧行为）。
  # false: 只在本地合并，最后一次性 push。
  push_per_round: true

# 验证命令安全 / Validation command safety
# 白名单中的命令前缀无需二次确认即可执行。
# 不在白名单中的命令需要用户二次确认。
validation:
  command_whitelist:
    - "ruff"
    - "mypy"
    - "pytest"
    - "swift"
    - "npm run"
    - "yarn"
    - "pnpm"
    - "go test"
    - "cargo"
    - "python"
    - "python3"

  # 键名对应项目模块（示例），AI 会根据改动的模块选择执行。
  # 使用者决定：这些命令完全由你配置，AI 只读取并执行你信任的命令。
  # User decides: these commands are fully configurable. The AI only reads and
  # executes commands you trust.
  commands:
    python:
      - "ruff check src/"
      - "mypy src/ --ignore-missing-imports"
      - "pytest tests/ -x -q --timeout=60"
    swift:
      - "swift build -c debug"
    typescript:
      - "npm run compile"

# Reviewer 输出校验 / Reviewer output validation
reviewer:
  # 是否对子代理返回的 JSON 进行 schema 校验，格式不符时自动重试。
  output_schema_validation: true

# Onboarding 状态（由 onboarding 流程自动写入，请勿手动编辑）
# Onboarding state (auto-generated by the onboarding flow; do not edit manually)
# 运行 `iterate onboard` 或在 AI 工具中调用 /iterate 时自动生成。
# Run `iterate onboard` or invoke /iterate in your AI tool to generate.
onboarding:
  # 指纹版本号 / Fingerprint schema version
  version: "1.0"
  # 是否在每次 /iterate 时检查 manifest 漂移 / Check manifest drift on each invocation
  drift_check: true
  # 此段在首次 onboarding 后由 CLI/AI 填充 / Populated after first onboarding
  # fingerprints:
  #   - path: "package.json"
  #     sha256: "..."

# 个性化配置 / Personalization
# 捕获 AI 扫描不到的项目专属约束和经验。
# Capture project-specific constraints AI scanning cannot discover.
# 运行 `iterate personalize` 或在 onboarding 向导中选择个性化配置来填充。
# Run `iterate personalize` or choose personalization in the onboarding wizard.
personalization:
  # 版本号 / Schema version (auto-managed, do not edit manually)
  # version: "1.0"

  # 禁区 / Protected files — iterate 不得修改（glob 模式）
  # protected_paths:
  #   - "legacy/**"
  #   - "vendor/**"

  # 风险区 / Risk areas — 改动需架构审批
  # risk_areas:
  #   - path: "src/auth/"
  #     reason: "认证模块，任何改动需架构审批"

  # 已知意图 / Known intentional — 抑制误报（文件:行号 + 维度）
  # known_intentional:
  #   - file: "db/queries.py"
  #     line: 42
  #     dimension: "tech-debt"
  #     reason: "使用 any 是性能优化，非技术债"

  # 维度定制 / Dimension focus — 追加 focus 到特定维度
  # dimension_focus:
  #   - dimension: "security"
  #     focus: "SQL 注入（项目历史上有过事故）"

  # 优先修复顺序 / Fix priority order — 从高到低
  # fix_priority_order:
  #   - security
  #   - correctness
  #   - performance

  # 禁止的修复方式 / Forbidden fixes
  # forbidden_fixes:
  #   - "try-catch 吞错"
  #   - "# noqa"
  #   - "// @ts-ignore"
