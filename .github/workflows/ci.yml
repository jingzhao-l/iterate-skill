name: CI

on:
  push:
    branches: [main, master]
    # badges/downloads.json is machine-generated by "Update downloads badge"
    # on a schedule; a data-only refresh must not re-run the test matrix.
    paths-ignore:
      - "badges/**"
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          # ruff is pinned on purpose: this repo declares no [tool.ruff.lint]
          # select, so the gate runs on ruff's default rule set, which shifts
          # between releases. Bump it deliberately, alongside a lint fix pass.
          pip install pytest "ruff==0.16.8"

      - name: Lint with ruff
        run: ruff check scripts/ tests/ iterate_cli/

      - name: Run pytest
        run: pytest tests/ -q

      - name: Validate default iterate.config.yaml
        run: python scripts/validate.py config config/iterate.config.yaml

      - name: Validate decision log template
        run: python scripts/validate.py decisions templates/iterate-decisions.template.md

      - name: Validate JSON schema is well-formed
        run: python -c "import json; json.load(open('config/config.schema.json'))"

  kernel-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run kernel test suite
        # The kernel's own suite is the C35 roundtrip gate: JSON Schema truth vs
        # the zod mirror. Nothing else in this repo's CI runs it, so a kernel
        # regression would otherwise land green.
        working-directory: kernel
        run: |
          npm ci
          npm test

      - name: Check the harness' vendored corpus against these fixtures
        # kernel/fixtures is the single source of truth for the cross-language
        # contract; iterate-harness is Python and cannot import the package, so it
        # vendors a sha256-pinned copy. A fixture moving here without re-recording
        # that pin goes red at this step, in the same commit that moved it, instead
        # of quietly leaving the two implementations asserting different bytes.
        run: python3 harness/iterate-harness/scripts/check_kernel_fixtures.py --source kernel/fixtures

      - name: Compare the two implementations case by case
        # The step above pins the *bytes*; this pins the *behaviour*: it drives the
        # built TypeScript dist and the Python modules over the same fixture corpus
        # and refuses when a verdict, a digest, or a registry rule disagrees.
        # `npm test` above already built kernel/dist, and the relative --kernel is
        # resolved by the script because the node driver it writes lives in /tmp.
        # This gate was not in CI at all until 2026-11-07, and it had silently
        # stopped comparing anything (its candidate roots were one directory level
        # short), so a cross-language divergence could land green.
        run: |
          PYTHONPATH=harness/iterate-harness/src python3 harness/iterate-harness/scripts/diff_kernel_implementations.py --kernel kernel

  npm-installer-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm-installer tests
        working-directory: npm-installer
        run: npm test
