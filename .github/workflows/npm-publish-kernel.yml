name: npm publish (iterate-kernel)

# Publishes the iterate-kernel npm package from the skill monorepo.
#
# iterate-kernel (kernel/) is a sibling of iterate-skill-installer: it has no
# separate distribution repository and is published from the main repo's
# `kernel/` directory. Before this workflow existed the kernel was published
# locally (`cd kernel && npm publish`), which is neither provenance-capable nor
# auditable. This workflow mirrors the installer one and adds `--provenance`,
# so npm attaches a cryptographically verifiable build origin (repo + workflow
# + tag) via a Trusted Publisher mapping:
#
#   package         -> repo(workflow file)
#   iterate-kernel  -> jingzhao-l/iterate-skill(.github/workflows/npm-publish-kernel.yml)
#
# Kernel versions are 0.1.x, so the release gate is `v0.1.*` tags. Manual
# dispatch is the other entry point and it must also name a `v0.1.x` ref: the
# version step compares package.json against the ref that was checked out and
# refuses anything that is not a kernel tag, so a dispatch at `main` can no
# longer publish whatever happens to sit on the branch.
#
# Precondition for OIDC trusted publishing: connect this workflow as a Trusted
# Publisher on npm for `iterate-kernel` (npmjs.com -> package -> Settings ->
# Trusted Publishing -> Connect a Publisher, values:
#   Package: iterate-kernel
#   GitHub owner/repo: jingzhao-l/iterate-skill
#   Workflow: .github/workflows/npm-publish-kernel.yml
#   Environment: <none>).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish from (optional; defaults to tagged event or default branch)
        required: false
        type: string

permissions:
  contents: read    # read the tagged tree; the workflow writes nothing back
  id-token: write   # mint an OIDC token so `npm publish --provenance` can sign the package

concurrency:
  group: npm-publish-iterate-kernel
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v0.1.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 ships npm 10, which predates OIDC trusted publishing
          # (added in npm 11.5.1). Node 24 keeps us on a non-EOL runtime.
          node-version: "24"

      - name: Install dependencies
        working-directory: kernel
        run: npm ci

      - name: Verify package version matches the release tag
        working-directory: kernel
        # A forgotten version bump used to publish the PREVIOUS version under a
        # new tag (npm rejects a duplicate version only once it is too late).
        # Fail before publishing instead.
        #
        # The ref used here must be the ref that was CHECKED OUT, which is
        # `release.tag_name || inputs.tag || github.ref_name` (see the checkout
        # step). Reading only the first two made a dispatch with `--ref` and no
        # `tag` input — the documented way to publish — compute an empty TAG, skip
        # the comparison entirely, and publish whatever version happened to sit at
        # that ref. A release is also only publishable from a tag: provenance
        # attested to `main` names a commit that has not moved yet, not one that
        # never will.
        #
        # Event fields go through env, never into the script text: a git ref may
        # contain quotes and backticks, so `"$TAG"` inline would be command
        # injection by anyone able to push a tag or dispatch with a `tag` input.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG:-${INPUT_TAG:-$WORKFLOW_REF}}"
          if ! [[ "$TAG" =~ ^v0\.1\.[0-9]+$ ]]; then
            echo "::error::refusing to publish from '$TAG': iterate-kernel releases come from a v0.1.x tag"
            echo "cut the tag on the commit that carries the version bump, then dispatch with --ref v0.1.<X>"
            exit 1
          fi
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::package.json version $PKG does not match release tag $TAG"
            exit 1
          fi
          echo "package.json version $PKG (tag: $TAG)"

      - name: Run kernel tests
        working-directory: kernel
        # Guards the contract/build surface (build + node --test) before it
        # reaches npm.
        run: npm test

      - name: Publish with provenance
        working-directory: kernel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Trusted publishing is the mechanism this workflow exists for: npm
        # restricted tokens that bypass 2FA for direct publishing, and the
        # `NPM_TOKEN` on this repo is one of those — the PUT comes back
        # `404 … or you do not have permission to access it`, which npm returns
        # for a rejected credential as well as for a missing package. Provenance
        # needs the OIDC identity anyway (`id-token: write` above), so no token is
        # configured here; any auth line a previous step or image default left
        # behind is removed so the OIDC exchange is unambiguously what authenticates.
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) on node $(node --version)"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is set but deliberately unused: a bypass-2FA token cannot publish any more."
          fi
          # npm's ambient trusted-publisher auth is only attempted when the runner
          # was handed an OIDC token request; without these two env vars npm falls
          # straight to ENEEDAUTH. Repo/org "allow OIDC" settings can withhold it,
          # so say which case this is instead of leaving the next reader to guess.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token request URL: present (ambient trusted publishing is available to this job)"
          else
            echo "OIDC token request URL: ABSENT — this runner was not given id-token, so npm cannot authenticate"
          fi
          # ENEEDAUTH has two very different causes and the remedy is not the same:
          # either an npmrc somewhere still resolves an (empty or rejected) auth
          # token, which npm honors before it ever attempts OIDC, or the registry
          # refused the minted OIDC token because this workflow is not registered
          # as one of the package's Trusted Publishers. Print which one it is.
          echo "--- npm config sources for the registry auth key ---"
          npm config list -l 2>/dev/null | grep -iE "_authToken|registry|userconfig|globalconfig|\\(builtin\\)" || echo "(none)"
          echo "--- publishing ---"
          if ! npm publish --provenance --access public; then
            latest="$(ls -t "$HOME/.npm/_logs"/*.log 2>/dev/null | head -1)"
            echo "--- npm debug log: requests and statuses ---"
            if [ -n "$latest" ]; then
              grep -iE "PUT |POST |http fetch|401|403|404|E[0-9]{3,}|trusted|provenance" "$latest" || echo "(no matching lines)"
            else
              echo "(no npm debug log found)"
            fi
            exit 1
          fi
