name: Update downloads badge

on:
  schedule:
    # Refresh badges/downloads.json hourly (top of every hour UTC) for fresher badges
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch cross-platform download counts
        run: python scripts/update_downloads_badge.py

      - name: Commit and push badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json
          if git diff --cached --quiet; then
            echo "No change to badges/downloads.json"
          else
            git commit -m "chore: refresh downloads badge data"
            git push
          fi
