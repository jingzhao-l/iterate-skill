name: Update downloads badge

on:
  schedule:
    # Refresh badges/downloads.json hourly (top of every hour UTC) for fresher badges
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch cross-platform download counts
        run: python scripts/update_downloads_badge.py

      - name: Commit and push badge data
        env:
          BADGE_PUSH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
        run: |
          if [ -z "$BADGE_PUSH_TOKEN" ]; then
            echo "::error::BADGE_PUSH_TOKEN secret is missing — cannot push badge data"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json
          if git diff --cached --quiet; then
            echo "No change to badges/downloads.json"
          else
            git commit -m "chore: refresh downloads badge data"
            # The repo ruleset requires verified signatures / PRs on main and
            # only bypasses the repo owner. Push as the owner (BADGE_PUSH_TOKEN)
            # so the badge refresh is not blocked by branch rules.
            # NOTE: actions/checkout persists GITHUB_TOKEN as an Authorization
            # extraheader which would take precedence over the inline PAT; strip
            # it before *any* remote operation so we authenticate as the owner.
            git config --unset-all "http.https://github.com/.extraheader" || true
            PUSH_URL="https://x-access-token:${BADGE_PUSH_TOKEN}@github.com/jingzhao-l/iterate-skill.git"
            # GitHub delivers `schedule` best-effort: a run can start hours after
            # its slot, and main keeps moving underneath it. A plain
            # `git push HEAD:main` is then rejected as non-fast-forward (the
            # ruleset also forbids force-push) and that entire refresh is lost —
            # observed 2026-09-22, where a 4.6h-late run left a 5h gap in the
            # badge. Rebase this one commit onto the current tip before pushing.
            # badges/downloads.json is generated output, so on conflict this
            # run's freshly fetched numbers must win: while rebasing, `-X theirs`
            # favours the replayed commit over the upstream tip.
            git fetch --quiet "$PUSH_URL" main
            if ! git rebase --quiet -X theirs FETCH_HEAD; then
              git rebase --abort
              echo "::error::could not rebase the badge refresh onto current main"
              exit 1
            fi
            git push --quiet "$PUSH_URL" HEAD:main
          fi
