name: npm publish (iterate-skill-installer)

# Publishes the iterate-skill-installer npm package from the skill monorepo.
#
# Reason for CI: publication was a local `cd npm-installer && npm publish`
# (RELEASE.md §1042-1049), which is neither provenance-capable nor auditable.
# Moving it into GitHub Actions and adding `--provenance` lets npm attach a
# cryptographically verifiable build origin (repo + workflow + tag) to every
# release via a Trusted Publisher mapping:
#
#   package         -> repo(workflow file)
#   iterate-skill-installer -> jingzhao-l/iterate-skill(.github/workflows/npm-publish.yml)
#
# Then `npm audit signatures` validates that the published artifact can be tied
# to a build in the claimed repository (no OIDC token is ever needed at publish
# time on a developer machine).
#
# Trigger gates: skill tags (v2.*/v3.*, the same gate as the .github release
# jobs) plus manual dispatch. The skill installer ships standalone from
# npm-installer/ and has NO dependency on any wheel/PyPI artifact, so it is safe
# to run directly on the release event.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish from (optional; defaults to tagged event or default branch)
        required: false
        type: string

permissions:
  contents: read    # read the tagged tree; the workflow writes nothing back
  id-token: write   # mint an OIDC token so `npm publish --provenance` can sign the package

concurrency:
  group: npm-publish-iterate-skill-installer
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 ships npm 10, which predates OIDC trusted publishing
          # (added in npm 11.5.1) — on Node 20 this job could only ever
          # authenticate via NPM_TOKEN. Node 24 also puts us back on a
          # non-EOL runtime (Node 20 went EOL 2026-04).
          node-version: "24"

      - name: Publish with provenance
        working-directory: npm-installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `setup-node`'s `registry-url` writes
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` unconditionally.
        # When the secret is unset that resolves to an *empty* token, and npm
        # raises ENEEDAUTH ("need auth This command requires you to be logged
        # in") before it ever attempts the OIDC exchange — so the Trusted
        # Publisher mapping documented at the top of this file could never be
        # reached. Emit the auth line ourselves: only when a token actually
        # exists, and leave it absent otherwise so npm falls back to OIDC.
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) on node $(node --version)"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN present; authenticating with the token."
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          else
            echo "NPM_TOKEN unset; relying on OIDC trusted publishing."
          fi
          npm publish --provenance --access public