name: Release

# This workflow is triggered on every published Release in the monorepo. The
# repo ships two INDEPENDENT distribution lines that must never cross-contaminate:
#   * the iterate-skill skill (tags v2.* / v3.*) -> skill tarball + SHA256SUMS
#   * the iterate-harness package (tags v1.*) -> built wheel, uploaded to the
#     same GitHub release AND pushed to PyPI (best-effort, gated on the
#     PYPI_PASSWORD secret).
# Job selection is therefore gated on the tag prefix. `workflow_dispatch` lets
# an operator re-run the harness wheel job against an existing tag when the
# `release` event did not fire (e.g. `gh workflow run release.yml --ref v1.14.0`).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to run the release jobs against'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checksums:
    # Skill distribution line only — runs for skill tags (v2.* / v3.*).
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v2') || startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v3')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Create release tarball locally
        run: |
          # Build the tarball deterministically from the tagged tree so the
          # checksum file can be uploaded *before* the installer downloads it.
          # GitHub's release tarball_url is auto-generated; we recreate a
          # stable archive here to publish a matching SHA256SUMS.txt asset.
          # The harness/ directory holds two independent distribution
          # sub-projects (iterate-harness, iterate-plugin) and must NOT ship
          # in the skill release tarball (see 2.3.17 release notes).
          git archive --format=tar.gz --prefix=iterate-skill/ \
            -o iterate-skill.tar.gz HEAD -- . ':!harness' ':!kernel' ':!tests' \
            ':!.githooks' ':!badges'

      - name: Generate SHA256 checksums
        run: |
          sha256sum iterate-skill.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign tarball and checksums with GPG (best-effort)
        # Imports the signing key and emits detached ASCII-armored signatures
        # (*.asc) alongside each release artifact, so consumers can verify
        # authenticity, not just integrity. Skips silently when the repo
        # secrets GPG_PRIVATE_KEY/GPG_PASSPHRASE are not set.
        env:
          GPG_INPUT_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # `secrets` is rejected by GitHub's workflow parser inside `if:`
          # (HTTP 422 "Unrecognized named-value: 'secrets'" — it made the whole
          # workflow invalid, so no release since 2026-09-27 could run).
          # `env:` still accepts it, so bind there and decide here instead.
          if [ -z "$GPG_INPUT_KEY" ]; then
            echo "GPG_PRIVATE_KEY not configured; skipping signing (best-effort)."
            exit 0
          fi
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          printf '%s\n' "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf '%s\n' "$GPG_INPUT_KEY" | gpg --batch --yes --import
          for f in iterate-skill.tar.gz SHA256SUMS.txt; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --detach-sign --armor "$f"
          done
          ls -la ./*.asc

      - name: Upload tarball and checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            iterate-skill.tar.gz
            SHA256SUMS.txt
            iterate-skill.tar.gz.asc
            SHA256SUMS.txt.asc

  qoder-package:
    # Qoder distribution line only — runs for skill tags (v2.* / v3.*).
    # Rebuilds the Qoder-compatible skill package (single top-level directory +
    # SKILL.md + references/) and uploads it to the release as a downloadable
    # asset. No Cloud Agents API upload: publication to the Qoder AppHub is
    # done manually by the operator via the packaged zip.
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v2') || startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v3')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild Qoder package
        run: python3 scripts/publish_qoder.py build --out iterate-qoder.zip

      - name: Sign Qoder package with GPG (best-effort)
        env:
          GPG_INPUT_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # `secrets` is rejected by GitHub's workflow parser inside `if:`
          # (HTTP 422 "Unrecognized named-value: 'secrets'" — it made the whole
          # workflow invalid, so no release since 2026-09-27 could run).
          # `env:` still accepts it, so bind there and decide here instead.
          if [ -z "$GPG_INPUT_KEY" ]; then
            echo "GPG_PRIVATE_KEY not configured; skipping signing (best-effort)."
            exit 0
          fi
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          printf '%s\n' "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf '%s\n' "$GPG_INPUT_KEY" | gpg --batch --yes --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --detach-sign --armor iterate-qoder.zip

      - name: Upload Qoder package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            iterate-qoder.zip
            iterate-qoder.zip.asc

  harness-wheel:
    # Harness distribution line only — runs for harness tags (v1.*).
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install and build web frontend (baked into the wheel)
        working-directory: harness/iterate-harness/frontend/web
        run: |
          npm ci
          npm run build

      - name: Verify web dist produced
        run: test -n "$(ls -A harness/iterate-harness/frontend/web/dist)" && echo "web dist present"

      - name: Build wheel
        working-directory: harness/iterate-harness
        run: uv build --wheel

      - name: Inspect built wheel
        run: |
          ls -la harness/iterate-harness/dist
          python -m zipfile -l harness/iterate-harness/dist/*.whl | { grep -E "_frontend_web/|_frontend/" | head -20 || true; }

      - name: Sign wheel with GPG (best-effort)
        env:
          GPG_INPUT_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # `secrets` is rejected by GitHub's workflow parser inside `if:`
          # (HTTP 422 "Unrecognized named-value: 'secrets'" — it made the whole
          # workflow invalid, so no release since 2026-09-27 could run).
          # `env:` still accepts it, so bind there and decide here instead.
          if [ -z "$GPG_INPUT_KEY" ]; then
            echo "GPG_PRIVATE_KEY not configured; skipping signing (best-effort)."
            exit 0
          fi
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          printf '%s\n' "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf '%s\n' "$GPG_INPUT_KEY" | gpg --batch --yes --import
          for f in harness/iterate-harness/dist/*.whl; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --detach-sign --armor "$f"
          done

      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            harness/iterate-harness/dist/*.whl
            harness/iterate-harness/dist/*.whl.asc

      - name: Publish wheel to PyPI (iff token configured)
        # The npm wrapper installs the harness by pip-resolving
        # `iterate-harness==X.Y.Z` against the user's mirror (e.g. tuna), so a
        # PyPI artifact is the primary install channel. Best-effort: if the
        # PYPI_PASSWORD secret isn't set, skip — the GitHub wheel asset above
        # remains a working fallback for the wrapper.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        working-directory: harness/iterate-harness
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_PASSWORD secret not configured; skipping PyPI publish"
            exit 0
          fi
          python -m pip install --upgrade twine
          twine upload --non-interactive --skip-existing dist/*.whl
